<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="book" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" rx="24" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="50" cy="50" r="30" fill="#A78BFA" opacity="0.4"/>
  <circle cx="350" cy="250" r="40" fill="#C4B5FD" opacity="0.3"/>
  <circle cx="330" cy="60" r="20" fill="#DDD6FE" opacity="0.3"/>
  <!-- Book icon -->
  <g transform="translate(140,60)">
    <rect x="0" y="20" width="120" height="90" rx="8" fill="url(#book)" stroke="#D97706" stroke-width="3"/>
    <line x1="60" y1="20" x2="60" y2="110" stroke="#D97706" stroke-width="2"/>
    <rect x="15" y="35" width="35" height="4" rx="2" fill="#92400E" opacity="0.5"/>
    <rect x="15" y="45" width="30" height="4" rx="2" fill="#92400E" opacity="0.4"/>
    <rect x="15" y="55" width="25" height="4" rx="2" fill="#92400E" opacity="0.3"/>
    <rect x="70" y="35" width="35" height="4" rx="2" fill="#92400E" opacity="0.5"/>
    <rect x="70" y="45" width="30" height="4" rx="2" fill="#92400E" opacity="0.4"/>
    <rect x="70" y="55" width="25" height="4" rx="2" fill="#92400E" opacity="0.3"/>
  </g>
  <!-- Play button -->
  <circle cx="200" cy="115" r="22" fill="white" opacity="0.9"/>
  <polygon points="193,103 193,127 213,115" fill="#6366F1"/>
  <!-- Urdu text -->
  <text x="200" y="195" text-anchor="middle" font-size="32" font-weight="bold" fill="white" font-family="serif" direction="rtl">حروف کی کہانیاں</text>
  <!-- English subtitle -->
  <text x="200" y="230" text-anchor="middle" font-size="16" font-weight="bold" fill="#DDD6FE" font-family="Comic Sans MS, cursive">Alphabet Stories</text>
  <!-- Stars -->
  <text x="80" y="270" font-size="24" fill="white" opacity="0.6">⭐</text>
  <text x="300" y="270" font-size="24" fill="white" opacity="0.6">⭐</text>
  <text x="190" y="270" font-size="20" fill="white" opacity="0.4">📚</text>
</svg>
