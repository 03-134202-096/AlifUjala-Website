<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#4c1d95"/>
    </linearGradient>
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FB923C"/>
      <stop offset="100%" style="stop-color:#EF4444"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24"/>
      <stop offset="100%" style="stop-color:#FB923C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- Stars -->
  <circle cx="25" cy="20" r="1.5" fill="rgba(255,255,255,0.45)"/>
  <circle cx="75" cy="10" r="1" fill="rgba(255,255,255,0.35)"/>
  <circle cx="150" cy="8" r="1.5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="280" cy="15" r="1" fill="rgba(255,255,255,0.4)"/>
  <circle cx="360" cy="8" r="1.5" fill="rgba(255,255,255,0.45)"/>
  <circle cx="390" cy="40" r="1" fill="rgba(255,255,255,0.35)"/>
  <circle cx="10" cy="100" r="1.5" fill="rgba(255,255,255,0.3)"/>
  <circle cx="395" cy="130" r="1" fill="rgba(255,255,255,0.35)"/>

  <!-- Falling letter tiles -->
  <!-- Tile 1 -->
  <rect x="50" y="30" width="60" height="60" rx="10" fill="#FF6B9D" fill-opacity="0.85" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <text x="80" y="72" font-family="serif" font-size="30" fill="white" text-anchor="middle" direction="rtl">ب</text>

  <!-- Tile 2 (target - golden glow) -->
  <rect x="170" y="20" width="65" height="65" rx="10" fill="#A78BFA" fill-opacity="0.9" stroke="rgba(250,204,21,0.9)" stroke-width="3"/>
  <text x="202" y="64" font-family="serif" font-size="34" fill="white" text-anchor="middle" direction="rtl">ا</text>

  <!-- Tile 3 -->
  <rect x="295" y="40" width="58" height="58" rx="10" fill="#60A5FA" fill-opacity="0.85" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <text x="324" y="79" font-family="serif" font-size="28" fill="white" text-anchor="middle" direction="rtl">ت</text>

  <!-- Tile 4 -->
  <rect x="100" y="120" width="55" height="55" rx="10" fill="#4ADE80" fill-opacity="0.8" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <text x="127" y="157" font-family="serif" font-size="26" fill="white" text-anchor="middle" direction="rtl">ج</text>

  <!-- Tile 5 -->
  <rect x="255" y="110" width="58" height="58" rx="10" fill="#FACC15" fill-opacity="0.85" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <text x="284" y="149" font-family="serif" font-size="28" fill="white" text-anchor="middle" direction="rtl">د</text>

  <!-- Dotted fall lines -->
  <line x1="202" y1="85" x2="202" y2="195" stroke="rgba(250,204,21,0.4)" stroke-width="2" stroke-dasharray="6,5"/>

  <!-- Basket body -->
  <path d="M140 230 Q140 265 200 268 Q260 265 260 230 Z" fill="url(#basketGrad)" stroke="rgba(255,255,255,0.55)" stroke-width="2.5"/>
  <!-- Basket weave lines -->
  <line x1="160" y1="230" x2="156" y2="265" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <line x1="185" y1="230" x2="183" y2="268" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <line x1="215" y1="230" x2="217" y2="268" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <line x1="240" y1="230" x2="244" y2="265" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- Basket rim -->
  <rect x="134" y="223" width="132" height="13" rx="6" fill="url(#rimGrad)" stroke="rgba(255,255,255,0.65)" stroke-width="2"/>

  <!-- Ground line -->
  <rect x="0" y="276" width="400" height="3" fill="rgba(167,139,250,0.4)" rx="1"/>

  <!-- Arrow keys hint -->
  <rect x="310" y="230" width="28" height="24" rx="5" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="324" y="247" font-family="Arial" font-size="14" fill="white" text-anchor="middle">←</text>
  <rect x="345" y="230" width="28" height="24" rx="5" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="359" y="247" font-family="Arial" font-size="14" fill="white" text-anchor="middle">→</text>

  <!-- Title -->
  <text x="200" y="298" font-family="Arial Black, Arial, sans-serif" font-size="13" font-weight="bold" fill="rgba(255,255,255,0.9)" text-anchor="middle" letter-spacing="0.5">Urdu Basket Catch</text>
</svg>
